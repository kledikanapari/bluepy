name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # No Python 3.8 builds for the newest runners
          - os: ubuntu-22.04
            python-version: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev
      - name: Build bluepy-helper
        run: make -C bluepy
      - name: Python tests
        run: python -m unittest discover -s tests -v

  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev
      - name: C tests
        run: make -C bluepy test
      - name: C tests with AddressSanitizer and UBSan
        run: |
          make -C bluepy clean
          make -C bluepy test CFLAGS="-g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel and import it
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import bluepy.btle, os; assert os.access(bluepy.btle.helperExe, os.X_OK)"
